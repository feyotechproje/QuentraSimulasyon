<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quentra · Office FullText / NGram Search</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="/shared/quentra-i18n.css" />
  <link rel="stylesheet" href="/shared/light-theme.css" />
</head>
<body>
  <div class="app">
    <!-- Toolbar -->
    <header class="toolbar">
      <div class="brand">
        <img class="brand-logo" src="/assets/quentra-logo.jpeg" alt="Quentra" />
        <span data-i18n="brand.sub">FullText / NGram · Office Search Lab</span>
      </div>
      <div class="tb-sep"></div>

      <!-- Run mode (Demo / Canlı) is injected here by live.js so it sits up front
           as the primary choice, matching the other sims. -->
      <div id="liveToggleSlot" class="tb-group"></div>

      <div class="status-pill baseline" id="statusPill"><span id="statusText" data-i18n="status.baseline">Baseline</span></div>

      <div class="tb-group seg" role="group" aria-label="Mode">
        <button class="tb active" data-mode="auto" data-group="mode" data-i18n="mode.auto">Auto Demo</button>
        <button class="tb" data-mode="baseline" data-group="mode" data-i18n="mode.baseline">Baseline</button>
        <button class="tb" data-mode="quentra" data-group="mode" data-i18n="mode.quentra">Quentra</button>
      </div>
      <div class="tb-group seg" role="group" aria-label="Simulation controls">
        <button class="ibtn ibtn-play" id="btnResume" title="Devam Et" aria-label="Devam Et" data-i18n-attr="title:btn.resume;aria-label:btn.resume">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="ibtn" id="btnPause" title="Duraklat" aria-label="Duraklat" data-i18n-attr="title:btn.pause;aria-label:btn.pause">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>
        </button>
        <button class="ibtn" id="btnReset" title="Sıfırla" aria-label="Sıfırla" data-i18n-attr="title:btn.reset;aria-label:btn.reset">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 5V2L8 6l4 4V7a5 5 0 11-5 5H5a7 7 0 107-7z"/></svg>
        </button>
      </div>
      <div class="tb-group">
        <span class="tb-label" data-i18n="speed.label">Speed</span>
        <select class="tb" id="speed">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select>
      </div>
    </header>

    <!-- Stage -->
    <div class="stage">
      <div class="canvas-wrap">
        <canvas id="scene"></canvas>
      </div>

      <aside class="panel">
        <!-- Side-by-side comparison of the two real query paths. Always shows
             BOTH so the difference reads at a glance, regardless of mode.
             Populated by live.js from refAvgMs / quentraAvgMs. -->
        <div class="panel-sec cmp-sec" id="cmpCard" hidden>
          <h4 data-i18n="panel.compare">Query Comparison</h4>
          <div class="cmp">
            <div class="cmp-row ref">
              <div class="cmp-top">
                <span class="cmp-name" data-i18n="cmp.reference">Reference · LIKE</span>
                <span class="cmp-ms" id="cmpRefMs">—</span>
              </div>
              <div class="cmp-sub"><span id="cmpRefScanned">—</span> <span data-i18n="cmp.scanned">scanned</span></div>
            </div>
            <div class="cmp-row qn">
              <div class="cmp-top">
                <span class="cmp-name" data-i18n="cmp.quentra">Quentra · :14330</span>
                <span class="cmp-ms" id="cmpQnMs">—</span>
              </div>
              <div class="cmp-sub"><span id="cmpQnScanned">—</span> <span data-i18n="cmp.scanned">scanned</span> · <span data-i18n="cmp.viaGw">via gateway</span></div>
            </div>
            <div class="cmp-speed" id="cmpSpeed"><span class="cmp-bolt">⚡</span> <span id="cmpSpeedVal">—</span></div>
          </div>
        </div>

        <div class="panel-sec">
          <h4 data-i18n="panel.liveMetrics">Live Metrics</h4>
          <div class="metrics">
            <div class="metric cpu-row" id="cpuCard">
              <div class="cpu-top">
                <span class="m-label" data-i18n="metric.cpu">CPU</span>
                <span class="m-val" id="mCpu">88%</span>
              </div>
              <div class="meter"><div class="meter-fill hot" id="mCpuBar" style="width:88%"></div></div>
            </div>
            <div class="metric bad" id="timeCard">
              <span class="m-label" data-i18n="metric.searchTime">Search Time</span>
              <span class="m-val" id="mTime">8.42 s</span>
            </div>
            <div class="metric bad" id="scannedCard">
              <span class="m-label" data-i18n="metric.docsScanned">Documents Scanned</span>
              <span class="m-val" id="mScanned">12,842,118</span>
            </div>
            <div class="metric" id="matchCard">
              <span class="m-label" data-i18n="metric.matches">Matches Found</span>
              <span class="m-val" id="mMatches">0 / 5</span>
            </div>
            <div class="metric" id="queueCard">
              <span class="m-label" data-i18n="metric.queue">Search Queue</span>
              <span class="m-val" id="mQueue">5</span>
            </div>
          </div>
        </div>

        <div class="panel-sec feed-sec">
          <h4 data-i18n="panel.liveEvents">Live Events</h4>
          <ul class="feed" id="feed"></ul>
        </div>
      </aside>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
