<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quentra Key Breaker · SQL Injection Defense Simulation</title>
  <link rel="stylesheet" href="/shared/quentra-i18n.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="/shared/light-theme.css" />
  <link rel="stylesheet" href="/shared/story-tour.css" />
</head>
<body>
  <div class="app">
    <!-- ================= TOP TOOLBAR ================= -->
    <header class="toolbar">
      <div class="brand">
        <span class="brand-mark" id="brandMark" aria-hidden="true"></span>
        <div class="brand-txt">
          <span class="brand-name"><b>KEY BREAKER</b></span>
          <span class="brand-sub" data-i18n="brand.sub">Stops SQL injection attacks before they reach your database</span>
        </div>
      </div>

      <div class="toolbar-center">
        <div class="tc-block">
          <span class="tc-label" data-i18n="tc.status">Status</span>
          <span class="status-pill" id="statusPill" data-state="running">
            <span class="status-dot"></span><span id="statusLabel" data-i18n="status.running">SIMULATION RUNNING</span>
          </span>
        </div>
        <div class="tc-sep"></div>
        <div class="tc-block">
          <span class="tc-label" data-i18n="tc.mode">Current Mode</span>
          <span class="mode-pill" id="modePill" data-mode="active" data-i18n="mode.pill.active">KEY BREAKER ACTIVE</span>
        </div>
        <div class="tc-sep"></div>
        <div class="tc-block">
          <span class="tc-label" data-i18n="tc.time">Simulation Time</span>
          <span class="clock" id="simClock">00:00</span>
        </div>
      </div>

      <div class="toolbar-controls">
        <button class="st-launch" id="btnStory" type="button" data-i18n="tour.button">Story</button>
        <div class="mode-group" role="group" aria-label="Mode">
          <button class="mode-btn" id="btnOff" type="button" data-i18n="mode.off">Protection Off</button>
          <button class="mode-btn is-on" id="btnActive" type="button" data-i18n="mode.active">Key Breaker Active</button>
          <button class="mode-btn is-auto" id="btnAuto" type="button" data-i18n="mode.auto">Auto Demo</button>
        </div>
        <div class="btn-group">
          <button class="btn" id="btnPause" type="button" data-i18n="btn.pause">Pause</button>
          <button class="btn" id="btnResume" type="button" data-i18n="btn.resume">Resume</button>
          <button class="btn btn-ghost" id="btnReset" type="button" data-i18n="btn.reset">Reset</button>
        </div>
        <div class="speed-group" role="group" aria-label="Speed">
          <button class="speed-btn" data-speed="0.5" type="button">0.5×</button>
          <button class="speed-btn is-active" data-speed="1" type="button">1×</button>
          <button class="speed-btn" data-speed="2" type="button">2×</button>
          <button class="speed-btn" data-speed="4" type="button">4×</button>
        </div>
      </div>
    </header>

    <!-- ================= KPI STRIP ================= -->
    <section class="kpi-strip" id="kpiStrip"></section>

    <!-- ================= MAIN GRID ================= -->
    <main class="grid">
      <!-- LEFT: live data (the CANLI VERİ panel docks into this column) +
           the outgoing query stream (every query headed for the database) -->
      <aside class="col col-left">
        <section class="panel panel-queries" id="queryPanel">
          <div class="panel-head"><span class="ph-icon">📡</span><h3 data-i18n="panel.queries">Outgoing Queries</h3></div>
          <div class="qstream" id="qstream"></div>
        </section>
      </aside>

      <!-- CENTER: canvas stage -->
      <section class="stage">
        <canvas id="scene"></canvas>
        <!-- Invisible tour anchors: the story camera needs DOM targets, but the
             scene is one canvas — these divs are positioned over its regions
             (VIEW coords -> CSS px) by placeAnchors() in main.js. -->
        <div class="tour-anchor" id="anchorAttackers"></div>
        <div class="tour-anchor" id="anchorHero"></div>
        <div class="tour-anchor" id="anchorGateway"></div>
        <div class="tour-anchor" id="anchorDb"></div>
        <div class="toggle-bar">
          <label class="tgl"><input type="checkbox" id="tglPaths" checked /> <span data-i18n="tgl.paths">Attack Paths</span></label>
          <label class="tgl"><input type="checkbox" id="tglSafe" checked /> <span data-i18n="tgl.safe">Safe Queries</span></label>
          <label class="tgl"><input type="checkbox" id="tglThreat" checked /> <span data-i18n="tgl.threat">Threat Analysis</span></label>
          <label class="tgl"><input type="checkbox" id="tglParticles" checked /> <span data-i18n="tgl.particles">Particles</span></label>
        </div>
      </section>

      <!-- RIGHT: live attack feed -->
      <aside class="col col-right">
        <section class="panel">
          <div class="panel-head"><span class="ph-icon">⚡</span><h3 data-i18n="panel.feed">Live Attack Feed</h3></div>
          <div class="feed" id="feed"></div>
        </section>
      </aside>
    </main>
  </div>

  <div class="cinematic" id="cinematic"><span id="cinematicText"></span></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
