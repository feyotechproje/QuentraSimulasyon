<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Quentra">
  <title>Quentra</title>
  <g fill="none" stroke="#5B3E9E" stroke-linecap="round">
    <!-- outer broken tech ring -->
    <circle cx="58" cy="58" r="52" stroke-width="4" stroke-dasharray="150 60" transform="rotate(-35 58 58)" opacity="0.55"/>
    <circle cx="58" cy="58" r="44" stroke-width="4" stroke-dasharray="120 40" transform="rotate(120 58 58)" opacity="0.75"/>
    <circle cx="58" cy="58" r="36" stroke-width="5" stroke-dasharray="95 30" transform="rotate(20 58 58)" opacity="0.9"/>
  </g>
  <!-- bold Q body -->
  <circle cx="58" cy="58" r="24" fill="none" stroke="#5B3E9E" stroke-width="11"/>
  <!-- Q swoosh tail -->
  <path d="M40 78 q10 14 24 6 q10 -6 22 4"
        fill="none" stroke="#5B3E9E" stroke-width="11" stroke-linecap="round"/>
</svg>
